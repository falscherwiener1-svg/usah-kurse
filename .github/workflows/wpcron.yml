name: WP Cron anstossen
# Hinter dem Cloudflare Cache erreichen Besucher den Server selten.
# Damit geplante Beitraege puenktlich erscheinen, rufen wir wp-cron.php alle 30 Minuten auf.
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: wp-cron.php aufrufen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "usah-cron/1.0 (+https://github.com/falscherwiener1-svg/usah-kurse)" --max-time 60 "https://usaktienhub.de/wp-cron.php?doing_wp_cron=$(date +%s)")
          echo "HTTP $code"
