name: IEX-Schlusskurse

on:
  schedule:
    - cron: "30 11 * * 2-6"     # Di–Sa 11:30 UTC (IEX stellt HIST am Folgetag bereit)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Monatsschlüsse nachtragen (Anzahl Monate, leer = nur täglich)"
        required: false

permissions:
  contents: write

concurrency:
  group: kurse-${{ inputs.backfill && 'backfill' || 'daily' }}

jobs:
  daily:
    if: ${{ !inputs.backfill }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python update.py
      - name: Speichern
        run: |
          git config user.name  "kurse-bot"
          git config user.email "kurse-bot@users.noreply.github.com"
          cp data/prices.json /tmp/neu.json
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python update.py --merge-file /tmp/neu.json
            git add data/prices.json
            git diff --cached --quiet && exit 0
            git commit -m "Kurse $(date -u +%F)" && git push && exit 0
            sleep 10
          done
          exit 1

  backfill-teil:
    if: ${{ inputs.backfill }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: { part: [0, 1, 2, 3, 4, 5] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python update.py --backfill ${{ inputs.backfill }} --part ${{ matrix.part }}/6
      - uses: actions/upload-artifact@v4
        with: { name: "teil-${{ matrix.part }}", path: parts/, retention-days: 3 }

  backfill-zusammenfuehren:
    needs: backfill-teil
    if: ${{ always() && inputs.backfill }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { path: parts/, pattern: "teil-*", merge-multiple: true }
      - name: Speichern
        run: |
          git config user.name  "kurse-bot"
          git config user.email "kurse-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            python update.py --merge
            git add data/prices.json
            git diff --cached --quiet && exit 0
            git commit -m "Backfill $(date -u +%F)" && git push && exit 0
            sleep 10
          done
          exit 1
